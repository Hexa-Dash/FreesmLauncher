# Build FreesmLauncher on real FreeBSD (inside a QEMU VM provided by vmactions/freebsd-vm).
#
# Put this file at:  .github/workflows/freebsd.yml   (in your fork of FreesmTeam/FreesmLauncher)
# Run it from:       Actions tab -> "FreeBSD build" -> "Run workflow"
# Result:            Artifacts at the bottom of the run page (tar.gz + sha256 + INSTALL.txt)

name: FreeBSD build

on:
  workflow_dispatch:
    inputs:
      releases:
        description: 'FreeBSD releases to build for, as a JSON list (supported by the VM action: 14.3, 14.4, 15.0, 15.1)'
        required: false
        default: '["14.4","15.1"]'
  push:
    paths:
      - '.github/workflows/freebsd.yml'

permissions:
  contents: read

jobs:
  build:
    name: FreeBSD ${{ matrix.release }} (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(inputs.releases || '["14.4","15.1"]') }}

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build in FreeBSD ${{ matrix.release }}
        uses: vmactions/freebsd-vm@v1
        env:
          RELEASE: ${{ matrix.release }}
        with:
          release: ${{ matrix.release }}
          arch: x86_64
          usesh: true
          envs: 'RELEASE'
          prepare: |
            set -eu
            export ASSUME_ALWAYS_YES=yes
            pkg update -f

            # Build dependencies. Package names follow the FreeBSD ports tree:
            #   cmake-core, ninja, pkgconf              -> build tools
            #   kf6-extra-cmake-modules                 -> ECM (find_package(ECM) / KDEInstallDirs)
            #   qt6-base, qt6-networkauth               -> Qt6 Core/Widgets/Network/Xml/Concurrent/OpenGL/DBus + NetworkAuth
            #   qt6-svg, qt6-imageformats               -> runtime image plugins (icons), harmless at build time
            #   cmark, libqrencode, tomlplusplus        -> found via find_package / pkg-config
            #   vulkan-headers                          -> required by Qt6Gui's CMake config (WrapVulkanHeaders)
            #   openjdk17                               -> builds the Java parts; JDK >= 20 cannot do "-source 7"
            # libarchive and zlib come from the FreeBSD base system.
            PKGS="cmake-core ninja pkgconf kf6-extra-cmake-modules qt6-base qt6-networkauth qt6-svg qt6-imageformats cmark libqrencode tomlplusplus vulkan-headers libglvnd libxkbcommon openjdk17"

            if ! pkg install -y $PKGS; then
              echo "::warning::Bulk install failed, retrying package by package"
              for p in $PKGS; do
                pkg install -y "$p" || echo "::warning::could not install $p"
              done
            fi

            # JDK 17 is required (the Java code is compiled with -source 7 -target 7).
            if [ ! -x /usr/local/openjdk17/bin/javac ]; then
              echo "::warning::openjdk17 missing, trying openjdk11"
              pkg install -y openjdk11
            fi

            pkg clean -a -y || true
            df -h /

          run: |
            set -eu

            # OpenJDK on FreeBSD needs fdescfs on /dev/fd and procfs on /proc.
            mount | grep -q ' on /dev/fd ' || mount -t fdescfs fdesc /dev/fd
            mount | grep -q ' on /proc ' || mount -t procfs proc /proc

            JAVA_HOME=""
            for d in /usr/local/openjdk17 /usr/local/openjdk11; do
              if [ -x "$d/bin/javac" ]; then JAVA_HOME="$d"; break; fi
            done
            if [ -z "$JAVA_HOME" ]; then echo "No suitable JDK found"; exit 1; fi
            export JAVA_HOME
            export PATH="$JAVA_HOME/bin:/usr/local/bin:$PATH"
            export PKG_CONFIG_PATH="/usr/local/libdata/pkgconfig:/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            javac -version

            freebsd-version
            uname -a
            sysctl hw.ncpu hw.physmem
            df -h /

            # Build outside the synced workspace so only the final files get copied back to the runner.
            BUILD=/tmp/build
            STAGE=/tmp/stage
            rm -rf "$BUILD" "$STAGE"

            cmake -S . -B "$BUILD" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DCMAKE_PREFIX_PATH=/usr/local \
              -DLauncher_QT_VERSION_MAJOR=6 \
              -DLauncher_BUILD_PLATFORM=FreeBSD \
              -DLauncher_DISABLE_WERROR=ON \
              -DBUILD_TESTING=OFF \
              -DENABLE_LTO=OFF

            JOBS=$(sysctl -n hw.ncpu)
            cmake --build "$BUILD" --parallel "$JOBS"

            DESTDIR="$STAGE" cmake --install "$BUILD" --strip

            echo "== Installed files =="
            (cd "$STAGE" && find . -type f | sort)

            # Sanity checks
            test -x "$STAGE/usr/local/bin/freesmlauncher"
            find "$STAGE" -name NewLaunch.jar | grep -q .
            find "$STAGE" -name JavaCheck.jar | grep -q .
            file "$STAGE/usr/local/bin/freesmlauncher"
            ldd "$STAGE/usr/local/bin/freesmlauncher" || true

            # Smoke test (headless). Not fatal: some setups cannot start Qt without a display.
            QT_QPA_PLATFORM=offscreen timeout 30 "$STAGE/usr/local/bin/freesmlauncher" --help || echo "smoke test returned non-zero (ignored)"

            # Package
            MAJ=$(sed -n 's/^set(Launcher_VERSION_MAJOR \([0-9]*\))/\1/p' CMakeLists.txt)
            MIN=$(sed -n 's/^set(Launcher_VERSION_MINOR \([0-9]*\))/\1/p' CMakeLists.txt)
            PAT=$(sed -n 's/^set(Launcher_VERSION_PATCH \([0-9]*\))/\1/p' CMakeLists.txt)
            VER="${MAJ}.${MIN}.${PAT}"
            NAME="freesmlauncher-${VER}-freebsd${RELEASE}-amd64"

            mkdir -p dist
            tar -C "$STAGE" -czf "dist/${NAME}.tar.gz" usr
            ldd "$STAGE/usr/local/bin/freesmlauncher" > "dist/${NAME}.ldd.txt" 2>&1 || true

            cat > dist/INSTALL.txt <<EOF
            FreesmLauncher ${VER} built on FreeBSD ${RELEASE} (amd64)

            1) Install runtime dependencies (as root):
                 pkg install qt6-base qt6-networkauth qt6-svg qt6-imageformats cmark libqrencode openjdk17 lwjgl3 xrandr ca_root_nss

            2) Install the launcher into /usr/local (as root):
                 tar -C / -xzf ${NAME}.tar.gz

            3) Run:
                 freesmlauncher

            Notes:
            - OpenJDK on FreeBSD needs fdescfs and procfs mounted. Add to /etc/fstab:
                 fdesc  /dev/fd  fdescfs  rw  0  0
                 proc   /proc    procfs   rw  0  0
            - Build for FreeBSD ${RELEASE}; use the matching release if you can.
            EOF

            (cd dist && sha256 -r "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
            ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freesmlauncher-freebsd-${{ matrix.release }}-amd64
          path: dist/*
          if-no-files-found: error
