name: Build FreesmLauncher for FreeBSD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.2'
          usesh: true
          sync: sshfs          # <-- تغییر از rsync به sshfs
          copyback: true
          mem: 8192            # <-- افزایش حافظه
          debug: true
          prepare: |
            set -x
            echo "===== Updating package repo ====="
            pkg update -f

            echo "===== Installing build tools ====="
            pkg install -y cmake ninja git bash pkgconf rsync

            echo "===== Installing Java ====="
            pkg install -y openjdk21

            echo "===== Installing Qt6 & KDE deps ====="
            pkg install -y qt6-base qt6-svg qt6-networkauth qt6-tools kf6-extra-cmake-modules

            echo "===== Installing libraries ====="
            pkg install -y tomlplusplus libarchive cmark libqrencode vulkan-headers libglvnd

            echo "===== Configuring SSH ====="
            echo "127.0.0.1 freebsd" >> /etc/hosts
            sysrc sshd_enable="YES"
            service sshd restart
            sleep 5
            service sshd status || true

          run: |
            set -e
            echo "===== System Info ====="
            freebsd-version
            uname -a
            sysctl -n hw.ncpu

            echo "===== Configure CMake ====="
            mkdir -p build
            cd build
            cmake .. \
              -GNinja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="/usr/local" \
              -DLauncher_BUILD_PLATFORM=FreeBSD \
              -DLauncher_QT_VERSION_MAJOR=6 \
              -DENABLE_LTO=ON \
              -DLauncher_USE_PCH=ON

            echo "===== Build ====="
            ninja -j$(sysctl -n hw.ncpu)

            echo "===== Create Package ====="
            mkdir -p /tmp/package
            DESTDIR=/tmp/package ninja install
            cd /tmp
            tar -czf FreeBSD-x86_64-FreesmLauncher.tar.gz package
            echo "Package created: $(ls -lh FreeBSD-x86_64-FreesmLauncher.tar.gz)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreesmLauncher-FreeBSD
          path: FreeBSD-x86_64-FreesmLauncher.tar.gz
